name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose Android publication needs recovery
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify release tag and package version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node -e "require('./electron/version-policy.cjs').assertTagMatchesVersion(process.argv[1], process.argv[2])" "$env:GITHUB_REF_NAME" "$version"
      - run: npm run build
      - name: Build Windows installer and updater metadata
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
        env:
          RITIM_GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Create GitHub release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $channel = node -p "require('./electron/version-policy.cjs').updateChannel(require('./package.json').version)"
          $assets = @(
            "release/Ritim-Setup-$version.exe"
            "release/Ritim-Setup-$version.exe.blockmap"
            "release/$channel.yml"
          )
          $releaseFlags = @()
          if ($env:GITHUB_REF_NAME.Contains('-')) {
            $releaseFlags += '--prerelease'
          }
          gh release create "$env:GITHUB_REF_NAME" $assets $releaseFlags --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "Ritim $releaseVersion" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows
    if: always() && (needs.windows.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.windows.result == 'skipped'))
    runs-on: ubuntu-latest
    env:
      RITIM_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify recovery tag and existing Windows release assets
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e "require('./electron/version-policy.cjs').assertTagMatchesVersion(process.argv[1], process.argv[2])" "$RITIM_RELEASE_TAG" "$version"
          channel="$(node -p "require('./electron/version-policy.cjs').updateChannel(require('./package.json').version)")"
          assets="$(gh release view "$RITIM_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for expected_asset in "Ritim-Setup-$version.exe" "Ritim-Setup-$version.exe.blockmap" "$channel.yml"; do
            printf '%s\n' "$assets" | grep -Fx -- "$expected_asset" > /dev/null || {
              echo "Required Windows release asset is missing: $expected_asset"
              exit 1
            }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - name: Sync Android project
        run: npm run android:sync
        env:
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Configure persistent Android signing
        shell: bash
        run: |
          test -n '${{ secrets.RITIM_ANDROID_KEYSTORE_BASE64 }}'
          echo '${{ secrets.RITIM_ANDROID_KEYSTORE_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/ritim-release.jks"
          echo "RITIM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ritim-release.jks" >> "$GITHUB_ENV"
          echo 'RITIM_ANDROID_KEYSTORE_PASSWORD=${{ secrets.RITIM_ANDROID_KEYSTORE_PASSWORD }}' >> "$GITHUB_ENV"
          echo 'RITIM_ANDROID_KEY_ALIAS=${{ secrets.RITIM_ANDROID_KEY_ALIAS }}' >> "$GITHUB_ENV"
          echo 'RITIM_ANDROID_KEY_PASSWORD=${{ secrets.RITIM_ANDROID_KEY_PASSWORD }}' >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Verify Android package version
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          expected_code="$(node -p "require('./electron/version-policy.cjs').androidVersionCode(require('./package.json').version)")"
          actual_version="$(apkanalyzer manifest version-name android/app/build/outputs/apk/debug/app-debug.apk)"
          actual_code="$(apkanalyzer manifest version-code android/app/build/outputs/apk/debug/app-debug.apk)"
          test "$actual_version" = "$expected_version" || {
            echo "APK version mismatch: expected $expected_version, got $actual_version"
            exit 1
          }
          test "$actual_code" = "$expected_code" || {
            echo "APK versionCode mismatch: expected $expected_code, got $actual_code"
            exit 1
          }
          expected_certificate="6a5b01605a4a767da6d21e199d805d8ea230c4da01dcc4335bd18891f36c4458"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path" || {
            echo "apksigner was not found under $ANDROID_HOME/build-tools"
            exit 1
          }
          if ! certificate_output="$("$apksigner_path" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk 2>&1)"; then
            printf '%s\n' "$certificate_output"
            echo "APK cryptographic signature verification failed"
            exit 1
          fi
          printf '%s\n' "$certificate_output"
          actual_certificate="$(printf '%s\n' "$certificate_output" | awk 'tolower($0) ~ /^signer.* certificate sha-256 digest:/ { print tolower($NF) }' | tr -d '\r' | sort -u)"
          test -n "$actual_certificate" || {
            echo "No APK signer certificate digest was found"
            exit 1
          }
          test "$actual_certificate" = "$expected_certificate" || {
            echo "APK signing certificate mismatch"
            echo "Actual signer certificate digest(s): $actual_certificate"
            exit 1
          }
      - name: Attach Android test APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Ritim-Android-${RITIM_RELEASE_TAG}.apk"
          gh release upload "$RITIM_RELEASE_TAG" "Ritim-Android-${RITIM_RELEASE_TAG}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
